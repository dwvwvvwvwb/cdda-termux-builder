name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bash syntax check
        run: |
          fail=0
          for f in install.sh scripts/*.sh; do
            [ -f "$f" ] || continue
            echo "== bash -n $f =="
            bash -n "$f" || fail=1
          done
          exit $fail

      - name: Python syntax check
        run: python3 -m py_compile scripts/i18n.py

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error

      - name: i18n check
        run: bash scripts/i18n.sh check

      - name: i18n lint
        run: bash scripts/i18n.sh lint

      - name: i18n stats
        run: bash scripts/i18n.sh stats